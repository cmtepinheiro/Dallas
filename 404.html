<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Dallas Autonomous</title>
    <meta name="robots" content="noindex">

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: var(--bg);
        }
        .error-code {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 14px;
            letter-spacing: 0.3em;
            margin-bottom: 18px;
        }
        .error-page h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin-bottom: 16px;
        }
        .error-page p {
            color: var(--text-dim);
            max-width: 460px;
            margin-bottom: 36px;
            font-size: 14px;
            line-height: 1.6;
        }
        .error-page .logo {
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="logo"><span class="logo-main">DALLAS</span><span class="logo-sub">INDUSTRIES</span></div>
        <div class="error-code">ERROR 404 · SIGNAL LOST</div>
        <h1>This flight path doesn't exist.</h1>
        <p>The page you're looking for was moved, renamed, or never took off. Let's get you back on course.</p>
        <a href="/" class="btn-primary">Return to Home</a>
    </main>
</body>
</html>
